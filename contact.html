<script>
(function () {
  const scriptURL =
    "https://script.google.com/macros/s/AKfycbzD02sQfmOFeCYCjxptSs8JSCM9BDPjHS3oKsMzII3pJ-RKK6gV6qGGH9o7Y0ycf1ws/exec";

  function setupVeloraForm() {
    const nameInput = document.getElementById("i8hamg");
    const emailInput = document.getElementById("i8hamg-2");
    const messageInput = document.getElementById("id4qq6");
    const submitButton = document.getElementById("imxqas");

    if (!nameInput || !emailInput || !messageInput || !submitButton) {
      console.error("VELORA: Form fields or button not found.");
      return;
    }

    submitButton.addEventListener("click", async function (event) {
      event.preventDefault();

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const message = messageInput.value.trim();

      if (!name || !email || !message) {
        alert("Please fill in all fields.");
        return;
      }

      submitButton.disabled = true;

      const data = new URLSearchParams({
        name: name,
        email: email,
        message: message
      });

      try {
        await fetch(scriptURL, {
          method: "POST",
          mode: "no-cors",
          body: data
        });

        alert("Your message was submitted. Please allow a moment for processing.");

        nameInput.value = "";
        emailInput.value = "";
        messageInput.value = "";
      } catch (error) {
        console.error("VELORA submission error:", error);
        alert("Submission failed. Please try again.");
      } finally {
        submitButton.disabled = false;
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupVeloraForm);
  } else {
    setupVeloraForm();
  }
})();
</script>
